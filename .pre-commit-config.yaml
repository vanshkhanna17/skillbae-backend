repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: unit tests
        entry: .venv/bin/python -m pytest tests/ -x -q -m "not integration"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
